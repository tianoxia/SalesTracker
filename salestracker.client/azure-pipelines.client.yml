trigger:
  branches:
    include:
    - master
  paths:
    include:
    - salestracker.client/**

pr:
  branches:
    include:
    - master
  paths:
    include:
    - salestracker.client/**

pool:
  name: 'SelfHosted-Test'

variables:
  azureServiceConnection: 'Azure subscription 1(deb09ec0-d58c-47c9-a1f3-49d2ed4098fc)'
  azureSubscriptionId: 'deb09ec0-d58c-47c9-a1f3-49d2ed4098fc'
  resourceGroupName: 'rg-dev-rickyx'
  resourceGroupLocation: 'East US'
  staticWebAppLocation: 'eastus2'
  staticWebAppName: 'salestracker-client-app'
  staticWebAppApiToken: '$(STATIC_WEB_APP_API_TOKEN)'

steps:
- task: UseNode@1
  displayName: 'Use Node.js 20'
  inputs:
    version: '20.x'

- task: AzureCLI@2
  displayName: 'Create or update resource group'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az group create --subscription "$(azureSubscriptionId)" --name "$(resourceGroupName)" --location "$(resourceGroupLocation)"

- task: AzureCLI@2
  displayName: 'Deploy Static Web App infrastructure (Bicep)'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az deployment group create --subscription "$(azureSubscriptionId)" --resource-group "$(resourceGroupName)" --template-file "$(Build.SourcesDirectory)/salestracker.client/staticwebapp.bicep" --parameters location="$(staticWebAppLocation)" staticWebAppName="$(staticWebAppName)"

- script: |
    npm ci
    npm run build -- --outDir dist
  displayName: 'Build React client'
  workingDirectory: '$(Build.SourcesDirectory)/salestracker.client'

- script: |
    if not exist "$(Build.SourcesDirectory)\salestracker.client\dist" (
      echo Dist folder not found at expected path.
      dir "$(Build.SourcesDirectory)\salestracker.client"
      exit /b 1
    )
    npx --yes @azure/static-web-apps-cli deploy "$(Build.SourcesDirectory)/salestracker.client/dist" --deployment-token "$(staticWebAppApiToken)" --env production
  displayName: 'Deploy React client to Azure Static Web Apps'
