trigger:
  branches:
    include:
    - master
  paths:
    include:
    - salestracker.client/**

pr:
  branches:
    include:
    - master
  paths:
    include:
    - salestracker.client/**

pool:
  name: 'SelfHosted-Test'

variables:
  azureServiceConnection: 'Azure subscription 1(deb09ec0-d58c-47c9-a1f3-49d2ed4098fc)'
  azureSubscriptionId: 'deb09ec0-d58c-47c9-a1f3-49d2ed4098fc'
  resourceGroupName: 'rg-dev-rickyx'
  resourceGroupLocation: 'East US'
  staticWebAppLocation: 'eastus2'
  staticWebAppName: 'salestracker-client-app'
  staticWebAppApiToken: '$(STATIC_WEB_APP_API_TOKEN)'

steps:
- task: UseNode@1
  displayName: 'Use Node.js 20'
  inputs:
    version: '20.x'

- task: AzureCLI@2
  displayName: 'Create or update resource group'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az group create --subscription "$(azureSubscriptionId)" --name "$(resourceGroupName)" --location "$(resourceGroupLocation)"

- task: AzureCLI@2
  displayName: 'Deploy Static Web App infrastructure (Bicep)'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az deployment group create --subscription "$(azureSubscriptionId)" --resource-group "$(resourceGroupName)" --template-file "$(Build.SourcesDirectory)/salestracker.client/staticwebapp.bicep" --parameters location="$(staticWebAppLocation)" staticWebAppName="$(staticWebAppName)"

- script: |
    echo CLIENT_YAML_MARKER_20260920_A
    echo Build.SourceVersion=$(Build.SourceVersion)
    echo Working directory before build:
    cd
    call npm ci
    call npx vite build --mode production --outDir dist
    set DIST_DIR=%CD%\dist
    if not exist "%DIST_DIR%\index.html" (
      echo dist\index.html not found after build
      echo Current directory: %CD%
      dir
      exit /b 1
    )
    dir "%DIST_DIR%"
    if "%SWA_TOKEN%"=="" (
      echo SWA token is empty at runtime
      exit /b 1
    )
    call npx --yes @azure/static-web-apps-cli deploy "%DIST_DIR%" --deployment-token "%SWA_TOKEN%" --env production --verbose
  displayName: 'Build and deploy React client'
  workingDirectory: '$(Build.SourcesDirectory)/salestracker.client'
  env:
    SWA_TOKEN: $(STATIC_WEB_APP_API_TOKEN)
